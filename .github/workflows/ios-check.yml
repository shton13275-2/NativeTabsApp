name: iOS Project Checks

on:
  push:
    branches:
      - setup/expo-native-tabs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate Expo iOS project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios
